<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Terminal Notes</title>
<meta name="theme-color" content="#f6f7f9">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f6;--border:#e2e5ea;--border-strong:#cfd4dc;
  --text:#1c2230;--muted:#6b7280;--faint:#9aa1ad;
  --accent:#2f5bea;--accent-soft:#eaf0ff;--danger:#d92d3a;--ok:#16a34a;
  --radius:12px;--radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 18px 48px rgba(16,24,40,.22);
  --mono:Menlo,Monaco,'SF Mono','Cascadia Mono','Courier New','PingFang HK','PingFang TC','Noto Sans TC','Microsoft JhengHei',monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1218;--surface:#181c25;--surface-2:#202531;--border:#2a303d;--border-strong:#3a4252;
    --text:#e8ebf1;--muted:#98a1b2;--faint:#677084;
    --accent:#7aa2ff;--accent-soft:#1d2a4d;--danger:#ff6b76;--ok:#4ade80;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 14px rgba(0,0,0,.4);--shadow-lg:0 18px 48px rgba(0,0,0,.6);
  }
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);-webkit-tap-highlight-color:transparent;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.app-wrap{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border);position:relative;display:flex;flex-direction:column}
.list-header{min-height:60px;padding:max(env(safe-area-inset-top),8px) 14px 8px 18px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10}
.header-title{font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--text);display:flex;align-items:center;gap:8px;white-space:nowrap}
.header-title::before{content:'';width:9px;height:9px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.list-actions{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--border);border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm)}
.status-badge{font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;max-width:132px;overflow:hidden;text-overflow:ellipsis;transition:background .25s,color .25s}
.s-default{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.s-synced{background:rgba(22,163,74,.12);color:var(--ok);border-color:rgba(22,163,74,.3)}
.s-syncing{background:rgba(245,158,11,.14);color:#b45309;border-color:rgba(245,158,11,.35)}
.s-error{background:rgba(217,45,58,.1);color:var(--danger);border-color:rgba(217,45,58,.3)}
@media (prefers-color-scheme:dark){.s-syncing{color:#fbbf24}}
.btn-retro{border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;min-height:34px;padding:0 12px;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);transition:background .15s,transform .1s,box-shadow .15s;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-retro:hover{background:var(--surface-2)}
.btn-retro:active{transform:scale(.96);box-shadow:none}
.btn-retro.danger{color:var(--danger)}
.btn-retro.danger:hover{background:rgba(217,45,58,.1)}
.btn-retro.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-retro.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-retro.load{width:100%;margin-top:12px;background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn-retro.load:hover{filter:brightness(.97);background:var(--accent-soft)}
@media (prefers-color-scheme:dark){.btn-retro.primary{color:#0f1218}}
.btn-retro:disabled{opacity:.55;cursor:not-allowed}
.icon-action{width:34px;height:34px;padding:0}
.list-actions .icon-action{width:32px;height:32px;border-color:transparent;background:transparent;box-shadow:none;border-radius:999px;color:var(--muted)}
.list-actions .icon-action:hover{background:var(--accent-soft);color:var(--accent)}
.notes-list{padding:14px 14px 120px;flex:1;display:flex;flex-direction:column;gap:10px}
.empty-state{text-align:center;padding:96px 24px;color:var(--faint)}
.empty-state svg{display:block;margin:0 auto 18px;opacity:.45;width:56px;height:56px}
.empty-state p{font-size:14px}
.empty-state p::after{content:'\9EDE\64CA \FF0B \65B0\589E\7B46\8A18';display:block;margin-top:8px;font-size:12px;opacity:.8}
.group-section{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.group-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;height:42px;border-radius:var(--radius);font-size:13px;font-weight:700;color:#fff;cursor:pointer;box-shadow:var(--shadow-md);user-select:none;-webkit-user-select:none;transition:filter .15s,transform .1s}
.group-header:active{filter:brightness(.92);transform:scale(.99)}
.group-title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-content{display:flex;flex-direction:column;gap:8px;padding-left:12px;border-left:2px solid var(--border-strong);margin-left:10px}
.group-content.collapsed{display:none}
.terminal-card{position:relative;display:flex;align-items:center;gap:10px;height:50px;padding:0 12px 0 14px;border-radius:var(--radius);border:1px solid rgba(0,0,0,.07);box-shadow:var(--shadow-sm);cursor:pointer;overflow:hidden;transition:transform .12s,box-shadow .15s;animation:fadeIn .22s ease-out}
.terminal-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.terminal-card:active{transform:scale(.99);box-shadow:none}
.card-dot{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.28);flex-shrink:0}
.card-dot.has-att{background:#2f5bea;box-shadow:0 0 0 3px rgba(47,91,234,.2)}
.card-content{flex:1;min-width:0;font-size:13.5px;color:#111827;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-content.empty{color:rgba(0,0,0,.45);font-style:italic;font-weight:500}
.card-meta{font-size:10.5px;color:rgba(0,0,0,.55);flex-shrink:0;white-space:nowrap;font-weight:600}
.card-tag-count{font-size:10.5px;color:#111827;background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.1);padding:2px 7px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;gap:4px;font-weight:700}
.card-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.iBtn{width:30px;height:30px;border-radius:8px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.5);transition:background .15s,color .15s}
.iBtn svg{display:block;width:16px;height:16px}
.iBtn:hover{background:rgba(255,255,255,.55);color:#2563eb}
.iBtn.copy:hover{color:#16a34a}
.iBtn.delete:hover{color:#dc2626}
.fab{position:fixed;bottom:max(env(safe-area-inset-bottom),24px);right:max(20px,calc(50vw - 260px));width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#3b6cff,#2442c9);color:#fff;border:none;box-shadow:0 10px 24px rgba(47,91,234,.45),0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer;transition:transform .12s,box-shadow .15s}
.fab:hover{box-shadow:0 14px 30px rgba(47,91,234,.5),0 2px 6px rgba(0,0,0,.15)}
.fab:active{transform:scale(.92)}
.editor-wrap{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:560px;transform:translateX(-50%);background:var(--surface);z-index:100;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
@media (min-width:561px){.editor-wrap{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.editor-header{min-height:56px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;flex-shrink:0}
.editor-actions{display:flex;gap:6px;align-items:center}
.group-bar{background:var(--surface-2);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.group-bar label{font-size:12px;color:var(--muted);font-weight:700}
.group-input{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.group-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.autosave-dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);transition:background .4s,box-shadow .4s;flex-shrink:0;margin-right:4px}
.autosave-dot.saving{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.autosave-dot.saved{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.download-bar{background:rgba(22,163,74,.1);border-bottom:1px solid rgba(22,163,74,.25);padding:8px;text-align:center;font-size:13px;color:var(--ok);display:flex;justify-content:center;align-items:center;gap:12px}
.download-bar a{text-decoration:underline;font-weight:700;color:inherit}
.download-bar button{background:none;border:none;cursor:pointer;color:var(--muted)}
.editor-textarea{flex:1;background:transparent;padding:20px 20px 28px;font-size:16px;color:var(--text);outline:none;resize:none;line-height:1.75;border:none;border-radius:0;-webkit-appearance:none}
.editor-textarea::placeholder{color:var(--faint)}
.attach-bar{background:var(--surface-2);border-top:1px solid var(--border);padding:10px 12px;padding-bottom:max(env(safe-area-inset-bottom),10px)}
.attach-scroll{display:flex;align-items:center;gap:10px;overflow-x:auto}
.att-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:5px 8px 5px 10px;border-radius:999px;box-shadow:var(--shadow-sm);flex-shrink:0}
.att-chip-info{display:flex;align-items:center;gap:6px;cursor:pointer}
.att-chip span{font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-chip-remove{background:none;border:none;cursor:pointer;color:var(--faint);display:flex;align-items:center}
.att-chip-remove:hover{color:var(--danger)}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:150;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:380px;max-height:92dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow-lg);animation:fadeIn .2s ease-out}
.modal h3{font-size:13px;letter-spacing:.12em;font-weight:800;margin-bottom:10px}
.modal h3.sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.modal .hint{font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:14px}
.modal .hint.small{font-size:11px;color:var(--faint);margin:2px 0 16px}
.modal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.modal input[type=url],.modal input[type=password],.modal input[type=text]{width:100%;height:38px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--surface-2);outline:none;transition:border-color .15s,box-shadow .15s}
.modal input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.modal hr{margin:16px 0;border:none;border-top:1px solid var(--border)}
.modal-row{display:flex;gap:8px}
.modal-row.end{justify-content:flex-end;margin-top:6px}
.modal .btn-retro{min-height:38px}
.modal-row .btn-retro{flex:1}
.modal-row.end .btn-retro{flex:0 0 auto;padding:0 18px}
.modal-link{display:none;margin:10px 0 0;text-align:center;color:var(--accent);font-size:12px;font-weight:700;text-decoration:underline}
.modal details{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px 10px;background:var(--surface-2)}
.modal summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--text);padding:10px 0;list-style:none}
.modal summary::-webkit-details-marker{display:none}
.modal summary::after{content:' \25BE';color:var(--muted)}
.toast{position:fixed;top:max(env(safe-area-inset-top),14px);margin-top:8px;left:50%;transform:translateX(-50%);background:rgba(20,24,33,.94);color:#fff;padding:10px 16px;border-radius:14px;font-size:12.5px;font-weight:600;line-height:1.45;box-shadow:var(--shadow-lg);z-index:300;display:none;align-items:center;gap:8px;width:max-content;max-width:min(92vw,420px);white-space:normal}
.toast.error{background:#b42318}
.toast svg{flex-shrink:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-flex}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const ICONS = {
  'check-circle': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',
  'chevron-left': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>',
  'clipboard': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6M9 18h3"/></svg>',
  'refresh': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8.1 8.1 0 0 0-14.9-3L3 11"/><path d="M3 4v7h7"/><path d="M4 13a8.1 8.1 0 0 0 14.9 3L21 13"/><path d="M21 20v-7h-7"/></svg>',
  'chevron-down': '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>',
  'chevron-up': '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>',
  'copy': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  'edit': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  'file': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>',
  'folder-open': '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>',
  'image': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
  'paperclip': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
  'plus': '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  'save': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>',
  'spinner': '<span class="spin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>',
  'times': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  'trash': '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  'settings': '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
};
const ic = (k) => ICONS[k] || '';

const CONFIG = {
  // Dropbox shared links are downloadable, but a public shared URL cannot write files.
  DROPBOX_URL: '',
  DROPBOX_TOKEN: '',
  DROPBOX_PATH: '/note.json',
  DROPBOX_APP_KEY: '',
  DROPBOX_REFRESH: ''
};

const DROPBOX_LS_KEY = 'tn_dropbox_url';
const DROPBOX_TOKEN_LS_KEY = 'tn_dropbox_token';
const DROPBOX_PATH_LS_KEY = 'tn_dropbox_path';
const DROPBOX_APPKEY_LS_KEY = 'tn_dropbox_appkey';
const DROPBOX_REFRESH_LS_KEY = 'tn_dropbox_refresh';
try {
  CONFIG.DROPBOX_URL = localStorage.getItem(DROPBOX_LS_KEY) || '';
  CONFIG.DROPBOX_TOKEN = localStorage.getItem(DROPBOX_TOKEN_LS_KEY) || '';
  CONFIG.DROPBOX_PATH = localStorage.getItem(DROPBOX_PATH_LS_KEY) || '/note.json';
  CONFIG.DROPBOX_APP_KEY = localStorage.getItem(DROPBOX_APPKEY_LS_KEY) || '';
  CONFIG.DROPBOX_REFRESH = localStorage.getItem(DROPBOX_REFRESH_LS_KEY) || '';
} catch(e) {
  CONFIG.DROPBOX_TOKEN = '';
  CONFIG.DROPBOX_PATH = '/note.json';
}
function normalizeDropboxURL(value){
  const raw = String(value || '').trim();
  if (!raw) return '';
  try{
    const url = new URL(raw);
    if (url.hostname === 'www.dropbox.com') url.hostname = 'dl.dropboxusercontent.com';
    if (url.hostname === 'dropbox.com') url.hostname = 'dl.dropboxusercontent.com';
    if (url.hostname === 'dl.dropboxusercontent.com') url.searchParams.set('dl', '1');
    return url.toString();
  } catch(e){ return raw; }
}

const Cloud = {
  lastError: '',
  async fetchNotes(){
    this.lastError = '';
    if (!CONFIG.DROPBOX_URL){ this.lastError = 'Dropbox link is not configured'; return null; }
    try{
      const res = await fetch(CONFIG.DROPBOX_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('Dropbox request failed (' + res.status + ')');
      const text = (await res.text()).replace(/^\uFEFF/, '').trim();
      let data;
      try { data = JSON.parse(text); }
      catch(e){ throw new Error(/^</.test(text) ? 'Link returned a web page, not JSON. Share the note.json file itself.' : 'note.json is not valid JSON'); }
      const result = Array.isArray(data) ? data : data && data.notes;
      if (!Array.isArray(result)) throw new Error('Dropbox note.json is not a notes array');
      return result;
    } catch(e){
      this.lastError = e && e.message ? e.message : 'Dropbox connection failed';
      return null;
    }
  },
  accessToken: '',
  accessExpiry: 0,
  async getToken(force){
    if (CONFIG.DROPBOX_APP_KEY && CONFIG.DROPBOX_REFRESH){
      if (!force && this.accessToken && Date.now() < this.accessExpiry - 60000) return this.accessToken;
      const res = await fetch('https://api.dropbox.com/oauth2/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: CONFIG.DROPBOX_REFRESH, client_id: CONFIG.DROPBOX_APP_KEY })
      });
      let j = {};
      try { j = await res.json(); } catch(e) {}
      if (!res.ok || !j.access_token) throw new Error('Token refresh failed (' + res.status + ')' + (j.error_description ? ': ' + j.error_description : ''));
      this.accessToken = j.access_token;
      this.accessExpiry = Date.now() + (Number(j.expires_in) || 14400) * 1000;
      return this.accessToken;
    }
    return CONFIG.DROPBOX_TOKEN || '';
  },
  async saveNotes(notes){
    let token = await this.getToken(false);
    if (!token) return false;
    const path = String(CONFIG.DROPBOX_PATH || '/note.json').trim();
    if (!path.startsWith('/')) throw new Error('Dropbox file path must start with /');
    const arg = JSON.stringify({ path, mode: 'overwrite', autorename: false, mute: true })
      .replace(/[\u007f-\uffff]/g, c => '\\u' + ('0000' + c.charCodeAt(0).toString(16)).slice(-4));
    const body = JSON.stringify(notes);
    const send = t => fetch('https://content.dropboxapi.com/2/files/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': arg },
      body
    });
    let res = await send(token);
    if (res.status === 401 && CONFIG.DROPBOX_APP_KEY && CONFIG.DROPBOX_REFRESH){
      token = await this.getToken(true);
      res = await send(token);
    }
    if (!res.ok){
      let detail = '';
      try { detail = (await res.json()).error_summary || ''; } catch(e) {}
      let hint = '';
      if (res.status === 401 && !(CONFIG.DROPBOX_APP_KEY && CONFIG.DROPBOX_REFRESH)) hint = ' - token expired; add App key + Refresh token in settings';
      throw new Error('Dropbox save failed (' + res.status + ')' + (detail ? ': ' + detail : '') + hint);
    }
    return true;
  },
  async upload(){ throw new Error('Dropbox mode cannot upload attachments from this page'); },
  async getFileURL(fileid){ return fileid || null; }
};

  '#1e3a8a', '#7f1d1d', '#92400e', '#065f46', '#4c1d95', '#831843',
  '#3730a3', '#155e75', '#3f6212', '#9a3412', '#334155', '#0f766e'

function colorForGroup(groupName){
  const groupNames = Array.from(new Set(
    notes.map(n => n.group && n.group.trim()).filter(Boolean)
  )).sort((a,b) => a.localeCompare(b));
  const groupIndex = groupNames.indexOf(String(groupName).trim());
  if (groupIndex >= 0 && groupIndex < GROUP_COLORS.length){
    return GROUP_COLORS[groupIndex];
  }
  if (groupIndex >= GROUP_COLORS.length){
    const hue = (groupIndex * 137.508) % 360;
    return 'hsl(' + hue.toFixed(2) + ' 65% 36%)';
  }
  let hash = 0;
  const s = String(groupName);
  for (let i = 0; i < s.length; i++){ hash = (hash * 31 + s.charCodeAt(i)) >>> 0; }
  return GROUP_COLORS[hash % GROUP_COLORS.length];
}

  const s = String(id);
  for (let i = 0; i < s.length; i++){ hash = (hash * 31 + s.charCodeAt(i)) >>> 0; }

  let added = 0, updated = 0;
  data.map(normalizeImportedNote).filter(Boolean).forEach(n => {

function handleExport() {
  try{
    const dataStr = JSON.stringify(notes, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
    const filename = 'terminal-notes-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    if (navigator.msSaveOrOpenBlob){
      navigator.msSaveOrOpenBlob(blob, filename);
      showToast('Exported ' + notes.length + ' notes!');
      return;
    }
    if (exportObjectUrl) URL.revokeObjectURL(exportObjectUrl);
    exportObjectUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = exportObjectUrl;
    a.download = filename;
    a.target = '_blank';
    a.style.display = 'none';
    document.body.appendChild(a);
    if ('download' in a) a.click();
    else window.open(exportObjectUrl, '_blank');
    document.body.removeChild(a);
    const fallbackLink = document.getElementById('export-download-link');
    if (fallbackLink){
      fallbackLink.href = exportObjectUrl;
      fallbackLink.download = filename;
      fallbackLink.style.display = 'block';
    }
    setTimeout(() => {
      if (exportObjectUrl){
        URL.revokeObjectURL(exportObjectUrl);
        exportObjectUrl = null;
      }
    }, 60000);
    showToast('Exported ' + notes.length + ' notes!');
  } catch(err){
    showToast('Export failed');
  }
}

function normalizeImportedNote(note, index){
  if (!note || typeof note !== 'object' || Array.isArray(note)) return null;
  const id = note.id === undefined || note.id === null ? '' : String(note.id).trim();
  if (!id) return null;
  const attachments = Array.isArray(note.attachments)
    ? note.attachments
        .filter(a => a && typeof a === 'object')
        .map(a => ({
          id: a.id || (Date.now() + '-' + index),
          type: a.type === 'image' ? 'image' : 'file',
          fileid: String(a.fileid || a.url || ''),
          name: String(a.name || 'Attachment'),
          size: Number(a.size) || 0
        }))
    : [];
  return {
    id,
    content: note.content === undefined || note.content === null ? '' : String(note.content),
    group: note.group === undefined || note.group === null ? '' : String(note.group),
    updatedAt: note.updatedAt && !Number.isNaN(new Date(note.updatedAt).getTime())
      ? new Date(note.updatedAt).toISOString()
      : new Date().toISOString(),
    attachments
  };
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (event) => {
    try {
      const parsed = JSON.parse(event.target.result);
      const importedNotes = Array.isArray(parsed) ? parsed : parsed && parsed.notes;
      if (!Array.isArray(importedNotes)) throw new Error('Invalid format');

      const validNotes = importedNotes
        .map((note, index) => normalizeImportedNote(note, index))
        .filter(Boolean);
      if (!validNotes.length && importedNotes.length){
        throw new Error('No valid notes');
      }

      const noteMap = new Map(
        notes.map((note, index) => [String(note.id), normalizeImportedNote(note, index) || note])
      );
      validNotes.forEach(note => noteMap.set(note.id, note));
      notes = Array.from(noteMap.values())
        .filter(Boolean)
        .sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      lsSave(notes);
      document.getElementById('setup-modal').style.display = 'none';
      render();

      try {
        const uploaded = await Cloud.saveNotes(notes);
        setStatus(uploaded ? 'Saved to Dropbox' : 'Saved locally');
        showToast(uploaded ? 'Imported and saved to Dropbox!' : 'Imported locally');
      } catch(err) {
        setStatus('Saved locally; Dropbox failed');
        showToast('Imported locally; Dropbox save failed');
      }
    } catch (err) {
      alert('Import failed: choose a valid Terminal Notes JSON backup.');
    }
    e.target.value = '';
  };
  reader.onerror = () => {
    alert('Import failed: could not read the selected file.');
    e.target.value = '';
  };
  reader.readAsText(file);
}

function currentNoteIsDirty(){
  const n = notes.find(x => String(x.id) === String(activeNoteId));
  if (!n) return false;
  return editorContent !== (n.content || '') ||
    editorGroup !== (n.group || '') ||
    JSON.stringify(editorAttachments) !== JSON.stringify(n.attachments || []);
}

async function refreshCurrentNote(){
  const noteId = activeNoteId;
  if (!noteId) return;
  if (currentNoteIsDirty() && !confirm('Discard unsaved changes and refresh this note?')) return;

  clearTimeout(autoSaveTimer);
  setStatus('Saving locally...');
  const cloudNotes = await Cloud.fetchNotes();
  if (Array.isArray(cloudNotes)){
    notes = cloudNotes;
    lsSave(notes);
    setStatus('Saved locally');
  } else if (!CONFIG.DROPBOX_URL) {
    setStatus('Dropbox not configured');
  } else {
    setStatus('Dropbox unavailable (cached)');
    showToast('Refresh failed; using cached note');
  }

  if (notes.some(n => String(n.id) === String(noteId))){
    openEditor(noteId);
    if (Array.isArray(cloudNotes)) showToast('Note refreshed');
  } else {
    activeNoteId = null;
    view = 'list';
    render();
    showToast('Note no longer exists');
  }
}

  let content = '';
  try{
    if (navigator.clipboard && navigator.clipboard.readText){
      content = await navigator.clipboard.readText();
    }
  } catch(e){}
  if (!content){
    content = prompt('Paste note text here:') || '';
  }
  if (!content) {
    showToast('Clipboard is empty');
    return;
  }

  const n = { id: Date.now().toString(), content, group: '', updatedAt: new Date().toISOString(), attachments: [] };
  notes.unshift(n);
  lsSave(notes);
  openEditor(n.id);
  triggerSave(true);
}

async function refreshNotes(){
  if (!CONFIG.DROPBOX_URL){
    setStatus('Local only');
    showToast('Set a Dropbox link in Settings');
    document.getElementById('setup-btn')?.click();
    return;
  }
  const requestVersion = ++cloudRequestVersion;
  setStatus('Loading from Dropbox...');
  const cloudNotes = await Cloud.fetchNotes();
  if (requestVersion !== cloudRequestVersion) return;
  if (!Array.isArray(cloudNotes)){
    setStatus('Dropbox unavailable (cached)');
    showToast(Cloud.lastError || 'Dropbox refresh failed; using cached notes');
    return;
  }
  notes = cloudNotes;
  lsSave(notes);
  setStatus('Loaded from Dropbox');
  render();
  showToast('Notes refreshed');
}
async function deleteAllNotes(){
  if (!notes.length){
    showToast('No notes to delete');
    return;
  }
  if (!confirm('Delete all notes? This cannot be undone.')) return;
  ++cloudRequestVersion;
  notes = [];
  lsSave(notes);
  render();
  try {
    const uploaded = await Cloud.saveNotes(notes);
    setStatus(uploaded ? 'Saved to Dropbox' : 'Saved locally');
    showToast(uploaded ? 'All notes deleted from Dropbox' : 'All notes deleted locally');
  } catch(e) {
    setStatus('Saved locally; Dropbox failed');
    showToast('Deleted locally; Dropbox save failed', true);
  }
}
function bindTrashEvents(){
  const app = document.getElementById('app');
  if (!app || app.dataset.trashBound) return;
  app.dataset.trashBound = 'true';
  app.addEventListener('click', (e) => {
    const button = e.target.closest('[data-del], #del-btn');
    if (!button) return;
    e.preventDefault();
    e.stopPropagation();
    const id = button.dataset.del || activeNoteId;
    if (id && confirm('Delete this note?')) deleteNote(id);
  }, true);
}

function bindEvents(){
  bindTrashEvents();
  if (view === 'list'){
    document.getElementById('fab').onclick = createNote;
    document.getElementById('clipboard-note-btn').onclick = createNoteFromClipboard;
    document.getElementById('refresh-all-btn').onclick = refreshNotes;
    document.getElementById('setup-btn').onclick = () => {
      document.getElementById('setup-dropbox-url').value = CONFIG.DROPBOX_URL;
      document.getElementById('setup-dropbox-token').value = CONFIG.DROPBOX_TOKEN;
      document.getElementById('setup-dropbox-path').value = CONFIG.DROPBOX_PATH;
      document.getElementById('setup-dropbox-appkey').value = CONFIG.DROPBOX_APP_KEY;
      document.getElementById('setup-dropbox-refresh').value = CONFIG.DROPBOX_REFRESH;
      document.getElementById('setup-modal').style.display = 'flex';
    };
    document.getElementById('setup-cancel').onclick = () => {
      document.getElementById('setup-modal').style.display = 'none';
    };
    document.getElementById('setup-save').onclick = () => {
      const input = document.getElementById('setup-dropbox-url').value.trim();
      const token = document.getElementById('setup-dropbox-token').value.replace(/[^\x21-\x7E]/g, '');
      const path = document.getElementById('setup-dropbox-path').value.trim() || '/note.json';
      CONFIG.DROPBOX_URL = normalizeDropboxURL(input);
      CONFIG.DROPBOX_TOKEN = token;
      CONFIG.DROPBOX_PATH = path.startsWith('/') ? path : '/' + path;
      CONFIG.DROPBOX_APP_KEY = document.getElementById('setup-dropbox-appkey').value.replace(/[^\x21-\x7E]/g, '');
      CONFIG.DROPBOX_REFRESH = document.getElementById('setup-dropbox-refresh').value.replace(/[^\x21-\x7E]/g, '');
      Cloud.accessToken = ''; Cloud.accessExpiry = 0;
      if (CONFIG.DROPBOX_APP_KEY) localStorage.setItem(DROPBOX_APPKEY_LS_KEY, CONFIG.DROPBOX_APP_KEY); else localStorage.removeItem(DROPBOX_APPKEY_LS_KEY);
      if (CONFIG.DROPBOX_REFRESH) localStorage.setItem(DROPBOX_REFRESH_LS_KEY, CONFIG.DROPBOX_REFRESH); else localStorage.removeItem(DROPBOX_REFRESH_LS_KEY);
      if (CONFIG.DROPBOX_URL) localStorage.setItem(DROPBOX_LS_KEY, CONFIG.DROPBOX_URL);
      else localStorage.removeItem(DROPBOX_LS_KEY);
      if (CONFIG.DROPBOX_TOKEN) localStorage.setItem(DROPBOX_TOKEN_LS_KEY, CONFIG.DROPBOX_TOKEN);
      else localStorage.removeItem(DROPBOX_TOKEN_LS_KEY);
      localStorage.setItem(DROPBOX_PATH_LS_KEY, CONFIG.DROPBOX_PATH);
      document.getElementById('setup-modal').style.display = 'none';
      showToast((CONFIG.DROPBOX_TOKEN || CONFIG.DROPBOX_REFRESH) ? 'Dropbox API settings saved!' : 'Local-only mode enabled');
      init(true);
    };
    const btnLoad = document.getElementById('btn-load');
    if(btnLoad) btnLoad.onclick = handleLoadDropbox;

    const btnExport = document.getElementById('btn-export');
    if(btnExport) btnExport.onclick = handleExport;

    const btnImport = document.getElementById('btn-import');
    if(btnImport) btnImport.onclick = () => document.getElementById('import-file').click();

    const fileImport = document.getElementById('import-file');
    if(fileImport) fileImport.onchange = handleImport;

    document.querySelectorAll('[data-group-toggle]').forEach(gh => {
      gh.onclick = () => {
        const gName = gh.dataset.groupToggle;
        collapsedGroups[gName] = !collapsedGroups[gName];
        render();
      };
    });

    document.querySelectorAll('[data-copy]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        const n = notes.find(x => String(x.id) === b.dataset.copy);
        showToast(copyText(n?.content || '') ? 'Copied!' : 'Copy failed');
      };
    });
    document.querySelectorAll('.terminal-card').forEach(c => {
      c.onclick = () => openEditor(c.dataset.id);
    });
  } else {
    document.getElementById('back-btn').onclick = closeEditor;
    document.getElementById('copy-note-btn').onclick = copyCurrentNote;
    document.getElementById('refresh-note-btn').onclick = refreshCurrentNote;
    const sb = document.getElementById('save-btn');
    if (sb) sb.onclick = () => triggerSave(true);
    
    const ta = document.getElementById('editor-ta');
    ta.oninput = (e) => { editorContent = e.target.value; scheduleAutoSave(); };
    
    const gi = document.getElementById('editor-group');
    if (gi){
      gi.oninput = (e) => { editorGroup = e.target.value; scheduleAutoSave(); };
    }

    document.getElementById('attach-btn').onclick = () => document.getElementById('file-input').click();
    document.getElementById('file-input').onchange = (e) => handleUpload(Array.from(e.target.files));
    const cdl = document.getElementById('close-dl');
    if (cdl) cdl.onclick = () => { editorDownloadLink = null; softRenderEditor(); };
    document.querySelectorAll('[data-rm]').forEach(b => {
      b.onclick = () => { editorAttachments.splice(b.dataset.rm, 1); softRenderEditor(); };
    });
    document.querySelectorAll('[data-dl]').forEach(d => {
      d.onclick = () => handleDownload(editorAttachments[d.dataset.dl]);
    });
  }
}

function softRenderEditor(){
  const ta = document.getElementById('editor-ta');
  const ss = ta ? ta.selectionStart : 0, se = ta ? ta.selectionEnd : 0, st = ta ? ta.scrollTop : 0;
  render();
  const nta = document.getElementById('editor-ta');
  if (nta){ nta.setSelectionRange(ss, se); nta.scrollTop = st; }
}

function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  setDot('saving');
  autoSaveTimer = setTimeout(() => triggerSave(false), 1500);
}

function triggerSave(showMsg = false){
  const idSnapshot = activeNoteId;
  if (!idSnapshot) return;
  savePromise = savePromise.then(() => doSave(showMsg, idSnapshot));
}

async function doSave(showMsg, noteId){
  if (!noteId) return;
  notes = notes.map(n => String(n.id) === String(noteId) ? { ...n, content: editorContent, group: editorGroup, attachments: editorAttachments, updatedAt: new Date().toISOString() } : n);
  lsSave(notes);
  setStatus('Saving locally...');
  setDot('saving');
  try{
    const uploaded = await Cloud.saveNotes(notes);
    const ts = new Date().toLocaleTimeString();
    setStatus(uploaded ? 'Saved to Dropbox ' + ts : 'Saved locally ' + ts);
    setDot('saved');
    if (showMsg) showToast(uploaded ? 'Note saved to Dropbox!' : 'Note saved locally.');
    setTimeout(() => setDot('idle'), 3000);
  } catch(e){
    setStatus('Saved locally; Dropbox failed');
    setDot('idle');
    if (showMsg) showToast(e.message || 'Dropbox save failed; saved locally.', true);
  }
}

function openEditor(id){
  clearTimeout(autoSaveTimer);
  autoSaveDotState = 'idle';
  const n = notes.find(x => String(x.id) === String(id));
  if (!n) return;
  activeNoteId = String(n.id);
  editorContent = n.content || '';
  editorGroup = n.group || '';
  editorAttachments = Array.isArray(n.attachments) ? [...n.attachments] : [];
  editorSaving = false;
  editorDownloadLink = null;
  view = 'editor';
  render();
  setTimeout(() => { const ta = document.getElementById('editor-ta'); if (ta) ta.focus(); }, 30);
}

function closeEditor(){
  clearTimeout(autoSaveTimer);
  if (autoSaveDotState === 'saving') triggerSave(false);
  activeNoteId = null;
  view = 'list';
  render();
}

function createNote(){
  const n = { id: Date.now().toString(), content: '', group: '', updatedAt: new Date().toISOString(), attachments: [] };
  notes.unshift(n);
  openEditor(n.id);
}

async function deleteNote(id){
  const noteId = String(id);
  const noteExists = notes.some(n => String(n.id) === noteId);
  if (!noteExists) {
    showToast('Note not found');
    return;
  }
  ++cloudRequestVersion;
  notes = notes.filter(n => String(n.id) !== noteId);
  lsSave(notes);
  clearTimeout(autoSaveTimer);
  if (String(activeNoteId) === noteId){
    activeNoteId = null;
    view = 'list';
  }
  render();
  showToast('Note deleted');
  try {
    const uploaded = await Cloud.saveNotes(notes);
    setStatus(uploaded ? 'Saved to Dropbox' : 'Saved locally');
  } catch(e) {
    setStatus('Saved locally; Dropbox failed');
    showToast('Deleted locally; Dropbox save failed', true);
  }
}

async function handleUpload(files){
  editorSaving = true;
  const ab = document.getElementById('attach-btn');
  if (ab){ ab.disabled = true; ab.innerHTML = ic('spinner') + ' Uploading...'; }
  for (const f of files){
    try{
      const res = await Cloud.upload(f);
      editorAttachments.push({ id: Date.now() + Math.random(), ...res });
    } catch(e){ showToast('Upload failed: ' + e.message); }
  }
  editorSaving = false;
  softRenderEditor();
}

async function handleDownload(att){
  const url = safeURL(await Cloud.getFileURL(att.fileid));
  if (!url){ showToast('Could not get link'); return; }
  editorDownloadLink = { url, name: att.name };
  softRenderEditor();
}

function init(skipSetup){
  const requestVersion = ++cloudRequestVersion;
  const cached = lsLoad();
  if (cached && cached.length){
    notes = cached;
    status = 'Cached';
    render();
  } else {
    status = 'Loading...';
    render();
  }
  
  if (!CONFIG.DROPBOX_URL){
    setStatus('Local only');
    if (view === 'list' && !skipSetup) document.getElementById('setup-btn')?.click();
    return;
  }
  Cloud.fetchNotes().then(data => {
    if (requestVersion !== cloudRequestVersion) return;
    if (data === null){
      setStatus(cached ? 'Dropbox unavailable (cached)' : 'Dropbox unavailable');
      return;
    }
    notes = data;
    lsSave(data);
    setStatus('Loaded from Dropbox');
    if (view === 'list') render();
  });
}

init();
</script>
