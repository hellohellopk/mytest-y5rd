<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Terminal Notes</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f6;--border:#e2e5ea;--border-strong:#cfd4dc;--text:#1c2230;--muted:#6b7280;--faint:#9aa1ad;--accent:#2f5bea;--accent-soft:#eaf0ff;--radius:10px;--radius-sm:8px;--shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow-md:0 4px 14px rgba(16,24,40,.08);--shadow-lg:0 18px 48px rgba(16,24,40,.22);--mono:Menlo,Monaco,'SF Mono','Cascadia Mono','Courier New','PingFang HK','PingFang TC','Noto Sans TC','Microsoft JhengHei',monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--surface:#181c25;--surface-2:#202531;--border:#2a303d;--border-strong:#3a4252;--text:#e8ebf1;--muted:#98a1b2;--faint:#677084;--accent:#7aa2ff;--accent-soft:#1d2a4d;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 14px rgba(0,0,0,.4);--shadow-lg:0 18px 48px rgba(0,0,0,.6)}}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);-webkit-tap-highlight-color:transparent;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.app-wrap{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border);display:flex;flex-direction:column}
.list-header{height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 94%,transparent),color-mix(in srgb,var(--surface-2) 90%,transparent));backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 10px rgba(16,24,40,.05);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10}
.header-title{font-size:12px;font-weight:800;letter-spacing:.16em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.header-title::before{content:'';width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#2f5bea);box-shadow:0 0 0 3px var(--accent-soft)}
.count{font-size:10.5px;font-weight:700;letter-spacing:0;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px}
.list-actions{display:flex;align-items:center;gap:0;padding:2px;border:1px solid var(--border);border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm)}
.led{display:inline-block;flex-shrink:0;width:10px;height:10px;margin:0 10px 0 6px;border-radius:50%;cursor:pointer;position:relative;transition:background .25s,box-shadow .25s}
.led::after{content:'';position:absolute;inset:-10px}
.s-default{background:#9aa1ad;box-shadow:0 0 0 3px rgba(154,161,173,.25)}
.s-synced{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25),0 0 8px rgba(34,197,94,.7)}
.s-syncing{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25),0 0 8px rgba(245,158,11,.6);animation:pulse 1s ease-in-out infinite}
.s-error{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.25),0 0 8px rgba(239,68,68,.7)}
@keyframes pulse{50%{opacity:.45}}
.btn-retro{border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;min-height:34px;padding:0 12px;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);transition:background .15s,transform .1s;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-retro:hover{background:var(--surface-2)}
.btn-retro:active{transform:scale(.96);box-shadow:none}
.btn-retro.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-retro:disabled{opacity:.55;cursor:not-allowed}
@media (prefers-color-scheme:dark){.btn-retro.primary{color:#0f1218}}
.icon-action{width:34px;height:34px;padding:0}
.list-actions .icon-action{width:28px;height:28px;min-height:28px;border-color:transparent;background:transparent;box-shadow:none;border-radius:999px;color:var(--muted)}
.list-actions .icon-action svg{width:14px;height:14px}
.list-actions .icon-action:hover{background:var(--accent-soft);color:var(--accent)}
.notes-list{padding:10px 10px 40px;flex:1;display:flex;flex-direction:column;gap:6px}
.empty-state{text-align:center;padding:80px 24px;color:var(--faint);font-size:14px;line-height:1.7}
.empty-state svg{display:block;margin:0 auto 16px;opacity:.45;width:52px;height:52px}
.terminal-card{display:flex;align-items:center;gap:8px;height:38px;padding:0 4px 0 12px;border-radius:var(--radius);border:1px solid rgba(0,0,0,.06);box-shadow:var(--shadow-sm);cursor:pointer;overflow:hidden;transition:transform .12s,box-shadow .15s;animation:fadeIn .2s ease-out}
.terminal-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.terminal-card:active{transform:scale(.99);box-shadow:none}
.card-content{flex:1;min-width:0;font-size:13px;color:#111827;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iBtn{width:30px;height:30px;border-radius:7px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.5);flex-shrink:0;transition:background .15s,color .15s}
.iBtn svg{display:block;width:15px;height:15px}
.iBtn:hover{background:rgba(255,255,255,.6);color:#16a34a}
.viewer{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:560px;transform:translateX(-50%);background:var(--surface);z-index:100;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
@media (min-width:561px){.viewer{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.viewer-header{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;flex-shrink:0}
.viewer-text{flex:1;overflow:auto;padding:18px 18px max(env(safe-area-inset-bottom),28px);font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.viewer-text a{color:var(--accent)}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:150;display:none;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow-lg);animation:fadeIn .2s ease-out}
.modal h3{font-size:13px;letter-spacing:.12em;font-weight:800;margin-bottom:10px}
.modal .hint{font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.modal input{width:100%;height:40px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--surface-2);outline:none;transition:border-color .15s,box-shadow .15s}
.modal input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.modal-row{display:flex;gap:8px;margin-top:14px}
.modal-row .btn-retro{flex:1;min-height:40px}
.toast{position:fixed;top:max(env(safe-area-inset-top),10px);margin-top:50px;left:50%;transform:translateX(-50%);background:rgba(20,24,33,.94);color:#fff;padding:9px 16px;border-radius:14px;font-size:12.5px;font-weight:600;line-height:1.45;box-shadow:var(--shadow-lg);z-index:300;display:none;align-items:center;gap:8px;width:max-content;max-width:min(92vw,420px)}
.toast.error{background:#b42318}
.toast svg{flex-shrink:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-flex}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="setup-modal" class="modal-backdrop">
  <div class="modal">
    <h3>CLIPBOARD.TXT</h3>
    <p class="hint">Paste the Dropbox share link of Clipboard.txt. Each non-empty line becomes one note, refreshed every 5 seconds. The file is only read, never modified. The link is saved only in this browser.</p>
    <label for="setup-url">Clipboard.txt link</label>
    <input id="setup-url" type="url" autocomplete="off" autocapitalize="off" placeholder="https://dl.dropbox.com/scl/fi/.../Clipboard.txt?rlkey=...&raw=1">
    <div class="modal-row">
      <button class="btn-retro" id="setup-cancel" type="button">Cancel</button>
      <button class="btn-retro primary" id="btn-load" type="button">Load from Dropbox</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const ICONS = {
  'check-circle':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',
  'times':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  'chevron-left':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>',
  'copy':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  'refresh':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8.1 8.1 0 0 0-14.9-3L3 11"/><path d="M3 4v7h7"/><path d="M4 13a8.1 8.1 0 0 0 14.9 3L21 13"/><path d="M21 20v-7h-7"/></svg>',
  'settings':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  'folder-open':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  'spinner':'<span class="spin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>'
};
const ic = k => ICONS[k] || '';
const $ = id => document.getElementById(id);

const URL_KEY = 'tn_clip_url';
const CACHE_KEY = 'tn_clip_cache';
const POLL_MS = 5000;

function hslToHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
}
const PALETTE = Array.from({ length: 256 }, (_, i) =>
  hslToHex((i * 137.508) % 360, 62 + (i % 4) * 7, 85 + (i % 5) * 2));

function assignColors(list){
  const used = new Set();
  return list.map(t => {
    let h = 0;
    for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
    let slot = h % 256;
    if (used.size < 256) while (used.has(slot)) slot = (slot + 1) % 256;
    used.add(slot);
    return PALETTE[slot];
  });
}

let url = '', lines = [], lastText = null, status = 'Loading...', view = 'list', openText = '', busy = false;

try { url = localStorage.getItem(URL_KEY) || ''; } catch(e) {}
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (Array.isArray(c)) lines = c.map(String); } catch(e) {}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function parseLines(t){ return String(t).replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim() !== ''); }

function normalizeURL(value){
  const raw = String(value || '').trim();
  if (!raw) return '';
  try {
    const u = new URL(raw);
    if (['www.dropbox.com','dropbox.com','dl.dropboxusercontent.com'].includes(u.hostname)) u.hostname = 'dl.dropbox.com';
    if (u.hostname === 'dl.dropbox.com'){ u.searchParams.delete('dl'); u.searchParams.set('raw', '1'); }
    return u.toString();
  } catch(e){ return raw; }
}

function statusClass(s){
  s = String(s);
  if (/fail|error|unavailable/i.test(s)) return 's-error';
  if (/^(Loaded|Synced)/.test(s)) return 's-synced';
  if (/^(Loading|Sync)/.test(s)) return 's-syncing';
  return 's-default';
}
function setStatus(s){
  status = s;
  const b = $('led');
  if (!b) return;
  b.className = 'led ' + statusClass(s);
  b.title = s;
  b.setAttribute('aria-label', s);
}

let toastTimer;
function showToast(msg, isError){
  const t = $('toast');
  t.innerHTML = (isError ? ic('times') : ic('check-circle')) + '<span>' + esc(msg) + '</span>';
  t.classList.toggle('error', !!isError);
  t.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, isError ? 4500 : 1800);
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e) {}
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  return ok;
}

function listHTML(){
  const header =
    '<div class="list-header"><span class="header-title">TERMINAL NOTES' + (lines.length ? '<span class="count">' + lines.length + '</span>' : '') + '</span>' +
    '<div class="list-actions">' +
      '<button class="btn-retro icon-action" id="refresh-btn" title="Refresh" aria-label="Refresh">' + ic('refresh') + '</button>' +
      '<button class="btn-retro icon-action" id="setup-btn" title="Settings" aria-label="Settings">' + ic('settings') + '</button>' +
      '<span id="led" class="led ' + statusClass(status) + '" role="img" title="' + esc(status) + '" aria-label="' + esc(status) + '"></span>' +
    '</div></div>';
  let body;
  if (!lines.length){
    body = '<div class="empty-state">' + ic('folder-open') + (url ? 'No lines in Clipboard.txt.' : 'Set the Clipboard.txt link in settings.') + '</div>';
  } else {
    const colors = assignColors(lines);
    body = lines.map((t, i) =>
      '<div class="terminal-card" data-i="' + i + '" style="background:' + colors[i] + '">' +
        '<div class="card-content">' + esc(t) + '</div>' +
        '<button class="iBtn" data-copy="' + i + '" aria-label="Copy">' + ic('copy') + '</button>' +
      '</div>').join('');
  }
  return '<div class="app-wrap">' + header + '<div class="notes-list">' + body + '</div></div>';
}
function viewerHTML(){
  return '<div class="viewer">' +
    '<div class="viewer-header">' +
      '<button class="btn-retro" id="back-btn">' + ic('chevron-left') + ' Back</button>' +
      '<button class="btn-retro icon-action" id="copy-open-btn" title="Copy" aria-label="Copy">' + ic('copy') + '</button>' +
    '</div>' +
    '<div class="viewer-text">' + linkify(openText) + '</div>' +
  '</div>';
}
function render(){
  const y = window.scrollY;
  $('app').innerHTML = view === 'list' ? listHTML() : viewerHTML();
  if (view === 'list') window.scrollTo(0, y);
}

$('app').addEventListener('click', async e => {
  const t = e.target;
  const copyBtn = t.closest('[data-copy]');
  if (copyBtn){
    e.stopPropagation();
    showToast(await copyText(lines[+copyBtn.dataset.copy] || '') ? 'Copied!' : 'Copy failed', false);
    return;
  }
  if (t.closest('#refresh-btn')){ refresh(true); return; }
  if (t.closest('#setup-btn')){ openSetup(); return; }
  if (t.closest('#led')){ showToast(status, /fail|error|unavailable/i.test(status)); return; }
  if (t.closest('#back-btn')){ view = 'list'; render(); return; }
  if (t.closest('#copy-open-btn')){ showToast(await copyText(openText) ? 'Copied!' : 'Copy failed', false); return; }
  if (t.closest('a')) return;
  const card = t.closest('.terminal-card');
  if (card){ openText = lines[+card.dataset.i] || ''; view = 'viewer'; render(); }
});

function openSetup(){
  $('setup-url').value = url;
  $('setup-modal').style.display = 'flex';
}
function closeSetup(){ $('setup-modal').style.display = 'none'; }
$('setup-cancel').onclick = closeSetup;
$('setup-modal').addEventListener('click', e => { if (e.target === $('setup-modal')) closeSetup(); });

async function fetchText(u){
  const res = await fetch(u, { cache: 'no-store' });
  if (!res.ok) throw new Error('Dropbox request failed (' + res.status + ')');
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('Link returned a web page, not the text file. Use the file share link.');
  return text;
}

async function refresh(manual, targetUrl){
  const u = targetUrl || url;
  if (!u){ if (manual) openSetup(); return false; }
  if (busy) return false;
  busy = true;
  if (manual) setStatus('Loading...');
  try {
    const text = await fetchText(u);
    const changed = text !== lastText;
    lastText = text;
    if (changed || manual || targetUrl){
      lines = parseLines(text);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(lines)); } catch(e) {}
      if (view === 'list') render();
    }
    setStatus('Loaded from Dropbox');
    return true;
  } catch(e){
    setStatus('Dropbox unavailable');
    if (manual || targetUrl) showToast(e && e.message ? e.message : 'Load failed', true);
    return false;
  } finally { busy = false; }
}

$('btn-load').onclick = async () => {
  const btn = $('btn-load');
  const u = normalizeURL($('setup-url').value);
  if (!u){ showToast('Enter a Dropbox link first', true); return; }
  const label = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = ic('spinner') + ' Loading...';
  const ok = await refresh(false, u);
  btn.disabled = false;
  btn.innerHTML = label;
  if (ok){
    url = u;
    try { localStorage.setItem(URL_KEY, url); } catch(e) {}
    closeSetup();
    showToast('Loaded ' + lines.length + ' lines');
  }
};

render();
if (url){
  setStatus('Loading...');
  refresh(false);
} else {
  setStatus('Not configured');
  openSetup();
}
setInterval(() => {
  if (document.hidden || !url || $('setup-modal').style.display === 'flex') return;
  refresh(false);
}, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden && url) refresh(false); });
</script>
</body>
</html>
